<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Topaz Enhancer</title>
<style>
body{font-family:sans-serif;background:#0f0f0f;color:#fff;text-align:center}
.box{margin:40px auto;padding:20px;width:320px;background:#1c1c1c;border-radius:12px}
input,button{width:100%;margin:10px 0;padding:10px;border-radius:8px}
button{background:#00ffaa;border:none;font-weight:bold}
</style>
</head>
<body>
<div class="box">
<h2>🔥 Video Enhancer</h2>
<input type="file" id="file">
<button onclick="go()">Enhance</button>
<pre id="out"></pre>
</div>

<script>
async function go(){
  const f=document.getElementById("file").files[0];
  const fd=new FormData(); fd.append("file",f);
  const r=await fetch("/enhance/video",{method:"POST",body:fd});
  const j=await r.json();
  document.getElementById("out").innerText=JSON.stringify(j,null,2);
}
</script>
</body>
</html>
