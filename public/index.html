<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Enhancer</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="dark">

<header class="header">
  <h1>AI Video Enhancer</h1>
  <div class="header-actions">
    <button id="modeToggle">🌙</button>
  </div>
</header>

<main class="container">
  <input type="file" id="file" accept="image/*,video/*">

  <select id="model">
    <option value="prob-4-4k">Ultra 4K</option>
    <option value="prob-4">Ultra</option>
    <option value="rhea-1">Clean</option>
    <option value="iris-2">Faces v2</option>
    <option value="iris-3">Faces v3 HQ</option>
    <option value="nyx-3">Anime</option>
    <option value="thf-4">Stabilize</option>
    <option value="astra-60">🚀 Astra FPS 60</option>
  </select>

  <button id="enhanceBtn" class="primary">Enhance</button>

  <p id="leaveWarn" class="warn hidden">⚠️ Please do not leave this page</p>

  <div id="loading" class="loading hidden">
    <div class="spinner"></div>
    <small id="eta"></small>
  </div>

  <div class="compare">
    <div class="panel">
      <h3>Before</h3>
      <video id="beforeVid" class="hidden" controls></video>
      <img id="beforeImg" class="hidden">
    </div>
    <div class="panel">
      <h3>After</h3>
      <video id="afterVid" class="hidden" controls></video>
      <img id="afterImg" class="hidden">
    </div>
  </div>

  <button id="downloadBtn" class="download hidden">⬇ Download</button>

  <div class="links">
    <a href="https://scenepacks.com/" target="_blank">🎬 ScenePacks</a>
    <a href="https://www.tiktok.com/@0ver4me" target="_blank">📩 Contact Me</a>
  </div>
</main>

<script src="app.js"></script>
</body>
</html>
