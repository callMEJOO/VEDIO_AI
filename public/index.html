<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Enhancer Pro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>✨ AI Image & Video Enhancer</h1>
  <p>Before / After • Automatic & Manual Control</p>
</header>

<div class="controls">
  <input type="file" id="file" accept="image/*,video/*">

  <select id="quality">
    <option value="auto">Auto Quality</option>
    <option value="fast">Fast</option>
    <option value="hq">High Quality</option>
    <option value="ultra">Ultra (Slow)</option>
  </select>

  <select id="model">
    <option value="auto">Auto Model</option>
    <option value="proteus">Proteus</option>
    <option value="iris">Iris (Faces)</option>
    <option value="artemis">Artemis HQ</option>
  </select>

  <button id="btn" onclick="start()">Enhance</button>
</div>

<div id="warning" class="warning hidden">
  ⚠️ من فضلك متطلعش من الصفحة أثناء المعالجة
</div>

<p id="eta"></p>

<div id="preview" class="preview hidden">
  <div class="panel">
    <h3>Before</h3>
    <img id="beforeImg" class="hidden">
    <video id="beforeVid" class="hidden" controls></video>
  </div>

  <div class="panel">
    <h3>After</h3>
    <img id="afterImg" class="hidden">
    <video id="afterVid" class="hidden" controls></video>
  </div>
</div>

<p id="status"></p>

<footer>
  <p class="watermark">
    © AI Enhancer • Powered by Topaz API<br>
    Owner:
    <a href="https://www.tiktok.com/@0ver4me?_r=1&_t=ZS-93t1Gk1hUjo" target="_blank">
      @0ver4me
    </a>
  </p>
</footer>

<script src="app.js"></script>
</body>
</html>
