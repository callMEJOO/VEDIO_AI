<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Image & Video Enhancer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <!-- HEADER -->
  <header class="top">
    <h1>AI Image & Video Enhancer</h1>
    <p>Ultra Quality • Before / After • AI Powered</p>
  </header>

  <!-- CONTROLS -->
  <div class="controls">
    <input type="file" id="file" accept="image/*,video/*">
    <button id="btn">Enhance (Ultra)</button>
  </div>

  <!-- LOADER -->
  <div id="loader" class="loader hidden">
    <div class="spinner"></div>
    <p id="loaderText">Uploading…</p>
  </div>

  <!-- PREVIEW -->
  <div id="preview" class="preview hidden">
    <div class="panel">
      <h3>Before</h3>
      <img id="beforeImg" class="hidden">
      <video id="beforeVid" class="hidden" controls></video>
    </div>

    <div class="panel">
      <h3>After</h3>
      <img id="afterImg" class="hidden">
      <video id="afterVid" class="hidden" controls></video>
    </div>
  </div>

  <!-- STATUS -->
  <p id="status" class="status"></p>

  <!-- DOWNLOAD -->
  <div id="actions" class="actions hidden">
    <a id="downloadBtn" class="download" download>
      ⬇️ Download Result
    </a>
  </div>

  <!-- FOOTER -->
  <footer>
    <p>
      Powered by Topaz AI<br>
      Built by <a href="https://www.tiktok.com/@0ver4me" target="_blank">@0ver4me</a>
    </p>
  </footer>

</div>

<script src="app.js"></script>
</body>
</html>
