<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Enhancer</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="dark">

<header>
  <h1>AI Video Enhancer</h1>
  <div class="top-actions">
    <select id="lang">
      <option value="en">English</option>
      <option value="ar">العربية</option>
    </select>
    <button id="mode">🌙</button>
  </div>
</header>

<main>
  <input type="file" id="file" accept="image/*,video/*">

  <select id="model">
    <option value="prob-4">Ultra (Best Overall)</option>
    <option value="rhea-1">Clean Video</option>
    <option value="iris-2">Faces v2</option>
    <option value="iris-3">Faces v3 HQ</option>
    <option value="nyx-3">Anime</option>
    <option value="slf-2">Strong Denoise</option>
    <option value="thf-4">Stabilize</option>
    <option value="wonder-1">Creative</option>
  </select>

  <button id="enhance">Enhance</button>

  <p id="warn" class="hidden">⚠️ Please do not leave this page</p>

  <div id="loader" class="hidden">⏳ Processing… <span id="eta"></span></div>

  <div class="compare">
    <div>
      <h3>Before</h3>
      <video id="before" controls></video>
      <img id="beforeImg">
    </div>
    <div>
      <h3>After</h3>
      <video id="after" controls></video>
      <img id="afterImg">
    </div>
  </div>

  <button id="download" class="hidden">⬇ Download</button>

  <a href="https://scenepacks.com/" class="back">← ScenePacks</a>
</main>

<script src="app.js"></script>
</body>
</html>
