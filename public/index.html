<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Video Enhancer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <header class="top">
    <h1>AI Video Enhancer</h1>
    <p>Ultra Quality • ASTRA FPS Boost • Premium Models</p>
  </header>

  <!-- CONTROLS -->
  <div class="controls">
    <input type="file" id="file" accept="image/*,video/*">

    <select id="preset">
      <option value="ultra">Ultra 4K (Max Quality)</option>
      <option value="astra">ASTRA (FPS Boost)</option>
    </select>

    <button id="btn">Enhance</button>
  </div>

  <!-- LOADER -->
  <div id="loader" class="loader hidden">
    <div class="spinner"></div>
    <p id="loaderText">Uploading…</p>
  </div>

  <!-- PREVIEW -->
  <div id="preview" class="preview hidden">
    <div class="panel">
      <h3>Before</h3>
      <img id="beforeImg" class="hidden">
      <video id="beforeVid" class="hidden" controls></video>
    </div>

    <div class="panel">
      <h3>After</h3>
      <img id="afterImg" class="hidden">
      <video id="afterVid" class="hidden" controls></video>
    </div>
  </div>

  <!-- STATUS -->
  <p id="status" class="status"></p>

  <!-- DOWNLOAD -->
  <div id="actions" class="actions hidden">
    <button id="downloadBtn" class="download">⬇️ Download Video</button>
  </div>

  <footer>
    Powered by Topaz Premium API
  </footer>

</div>

<script src="app.js"></script>
</body>
</html>
