<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AI Enhancer Pro</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header>
  <h1>🔥 AI Image & Video Enhancer</h1>
  <p>Automatic Enhancement • Before / After</p>
</header>

<div class="controls">
  <select id="mode">
    <option value="image">🖼 Image</option>
    <option value="video">🎬 Video</option>
  </select>
  <input type="file" id="file" />
  <button id="btn" onclick="start()">Enhance</button>
</div>

<div class="preview hidden" id="preview">
  <div class="panel">
    <h3>Before</h3>
    <img id="beforeImg" class="hidden">
    <video id="beforeVid" class="hidden" controls></video>
  </div>

  <div class="panel">
    <h3>After</h3>
    <img id="afterImg" class="hidden">
    <video id="afterVid" class="hidden" controls></video>
  </div>
</div>

<p id="status"></p>

<footer>

    Contact Owner:

      TikTok @0ver4me
    </a>
  </p>
  <p>
    For ScenePack HQ Clips:
    <a href="https://scenepacks.com/" target="_blank">scenepacks.com</a>
  </p>
</footer>

<script src="app.js"></script>
</body>
</html>
